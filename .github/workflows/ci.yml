name: Tests

# Runs the suite and the type checker on every push and pull request. The
# publish workflow deliberately does not do this — it fires only on a version
# tag, which is far too late to learn that something is broken.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one version failing should not hide the others
      matrix:
        # The versions pyproject.toml claims support for in its classifiers.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,instruments]"
      - name: Run the tests
        run: python -m pytest
      - name: Type-check
        run: python -m mypy pymididefs tests

  base-install:
    # Instrument definitions need a YAML parser, which is an optional extra so
    # that `import pymididefs` keeps pulling in nothing. Nothing in the suite
    # above can check that, because the suite above has the parser installed.
    # This job is the whole verification of the property the extra exists for.
    name: Base install pulls in nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install without the instruments extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Prove the YAML parser really is absent
        # Without this the job could pass while proving nothing, if a dev
        # dependency ever started pulling PyYAML in behind our backs.
        run: |
          if python -c "import yaml" 2>/dev/null; then
            echo "PyYAML is installed, so this job cannot check what it exists to check."
            exit 1
          fi
          echo "PyYAML absent, as intended."
      - name: The package still imports, and reading says what to install
        run: python -m pytest tests/test_package.py -v
      - name: The rest of the suite still passes without it
        run: python -m pytest
