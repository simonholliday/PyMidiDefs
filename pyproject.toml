[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymididefs"
dynamic = ["version"]
description = "Comprehensive MIDI 1.0 and 2.0 constant definitions for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
	{name = "Simon Holliday"},
]
keywords = [
	"midi",
	"music",
	"general-midi",
	"midi2",
	"constants",
	"definitions",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Multimedia :: Sound/Audio :: MIDI",
	"Typing :: Typed",
]

[project.optional-dependencies]
# Reading instrument definitions needs a YAML parser. It is an extra rather
# than a dependency so that `import pymididefs` keeps pulling in nothing at
# all, which is the promise the rest of the package is built on.
instruments = [
	"PyYAML>=6.0",
]
dev = [
	"pytest",
	"mypy",
	"types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/simonholliday/PyMidiDefs"
Repository = "https://github.com/simonholliday/PyMidiDefs"
Issues = "https://github.com/simonholliday/PyMidiDefs/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
# Ship the package, its tests, and the standard project metadata; keep
# local editor/agent config and caches out of the published source archive.
exclude = [
	".claude",
	".github",
	".mypy_cache",
	".pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
# The working tree lives on CIFS, where mypy's incremental cache goes stale in
# ways that abort the run with an INTERNAL ERROR rather than a type error.
# Keep the cache on local disk; it is disposable and never committed.
cache_dir = "/tmp/mypy-cache-pymididefs"
