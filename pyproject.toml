[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymididefs"
dynamic = ["version"]
description = "Comprehensive MIDI 1.0 and 2.0 constant definitions for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
	{name = "Simon Holliday"},
]
keywords = [
	"midi",
	"music",
	"general-midi",
	"midi2",
	"constants",
	"definitions",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Multimedia :: Sound/Audio :: MIDI",
	"Typing :: Typed",
]

[project.optional-dependencies]
dev = [
	"pytest",
	"mypy",
]

[project.urls]
Homepage = "https://github.com/simonholliday/PyMidiDefs"
Repository = "https://github.com/simonholliday/PyMidiDefs"
Issues = "https://github.com/simonholliday/PyMidiDefs/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
# Ship the package, its tests, and the standard project metadata; keep
# local editor/agent config and caches out of the published source archive.
exclude = [
	".claude",
	".github",
	".mypy_cache",
	".pytest_cache",
	".subroutine",
]

[tool.pytest.ini_options]
# Only the tests are collected.  The examples in the package's docstrings, and
# the ones in README.md, are run by tests/test_docstrings.py rather than by
# putting --doctest-modules here: collecting the package directory as well
# breaks the invocations a packager uses -- `--import-mode=append` against an
# installed wheel stops on import-file-mismatch errors, `--import-mode=importlib`
# silently tests the installed copy instead of the checkout, `-p no:doctest`
# becomes a usage error, and pytest before 7.2 aborts if the source directory
# is absent.  A test in tests/ has none of those problems and runs the same
# examples whichever way pytest is invoked.
testpaths = ["tests"]

[tool.mypy]
strict = true
# The working tree lives on CIFS, where mypy's incremental cache goes stale in
# ways that abort the run with an INTERNAL ERROR rather than a type error.
# Keep the cache on local disk; it is disposable and never committed.
cache_dir = "/tmp/mypy-cache-pymididefs"
